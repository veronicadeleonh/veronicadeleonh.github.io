{{/* Evidence renderers for /how-i-build/: window.HIB_EV.render(evidence) draws a block from its real data
     (data/how_i_build.yaml → projects[].evidence). Types: tokens, contrast. */}}
<style>
.ev { margin: var(--space-1) 0 var(--space-1); font-family: var(--font-mono); font-size: var(--font-size-xs); color: var(--color-text-secondary); }
.ev-cap { font-size: var(--font-size-sm) !important; color: var(--color-text-secondary); }
.ev-more { margin-top: var(--space-1); }
.ev-more summary { font-family: var(--font-mono); font-size: var(--font-size-xs); color: var(--color-text-tertiary); cursor: pointer; width: fit-content; }
.ev-more summary:hover { color: var(--color-text); }
.ev-more p { font-size: var(--font-size-sm) !important; color: var(--color-text-secondary); margin-top: var(--space-1) !important; }
.ev-label { color: var(--color-text-tertiary); margin-bottom: 6px; }

.ev-cvd-cell span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ev-cvd-cell i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid; }
.ev-cvd { display: grid; grid-template-columns: minmax(0, 1.1fr) 1fr 14px 1fr; align-items: center; gap: 4px 8px; margin-top: var(--space-3); }
.ev-cvd .tk { color: var(--color-text); font-size: var(--font-size-xs); }
.ev-cvd .arrow { color: var(--color-text-tertiary); text-align: center; }
.ev-cvd-cell { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 8px; font-family: var(--font-sans); font-size: 11px; color: #18222b; }

/* tokens: drift of hard-coded values, then the token set */
.ev-drift { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-3); }
.ev-bars { display: grid; grid-template-columns: max-content 1fr 30px; align-items: center; gap: 4px 6px; }
.ev-bars .b { height: 10px; background: var(--color-text-tertiary); }
.ev-bars .b.last { background: var(--color-text); }
.ev-bars .n { text-align: right; color: var(--color-text); }
.ev-stack { display: flex; height: 14px; gap: 2px; margin-bottom: 6px; }
.ev-stack span { background: var(--color-text); opacity: var(--o); }
.ev-keys { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.ev-keys span { white-space: nowrap; }
.ev-keys i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--color-text); opacity: var(--o); }

/* contrast: real colors, ratios computed in the browser */
.ev-cr { display: grid; grid-template-columns: minmax(0, 1.1fr) 1fr 14px 1fr; align-items: center; gap: 4px 8px; }
.ev-cr .tk { color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-cr .tk small { display: block; white-space: normal; color: var(--color-text-tertiary); font-size: 10px; }
.ev-sw { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 8px; }
.ev-sw .aa { font-family: var(--font-sans); font-size: 15px; font-weight: 500; }
.ev-sw .r { font-size: 10px; padding: 1px 5px; border: 1px solid currentColor; }
.ev-sw .r.fail { color: var(--color-orange); background: var(--color-bg); }
.ev-sw .r.pass { color: var(--color-green); background: var(--color-bg); }
.ev-cr .arrow { color: var(--color-text-tertiary); text-align: center; }
.ev-crit { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--space-3); }
.ev-crit span { border: 1px solid var(--color-border); padding: 2px 6px; color: var(--color-text); }
.ev-crit .x { font-style: normal; color: var(--color-text-tertiary); margin-left: 4px; }

@media (max-width: 600px) {
  .ev-drift { grid-template-columns: 1fr; }
  .ev-cr { grid-template-columns: 1fr 1fr 14px 1fr; }
}
</style>
<script>
window.HIB_EV = (function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // WCAG 2 contrast, with the foreground's alpha blended over the background
  function rgba(c) {
    var m = c.match(/rgba?\(([^)]+)\)/);
    if (m) { var p = m[1].split(",").map(parseFloat); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; }
    var h = c.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1];
  }
  function lum(c) { return c.slice(0, 3).reduce(function (s, v, i) { v /= 255; v = v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0); }
  function ratio(fg, bg) {
    var f = rgba(fg), b = rgba(bg), a = f[3], mix = [0, 1, 2].map(function (i) { return f[i] * a + b[i] * (1 - a); });
    var l1 = lum(mix), l2 = lum(b), hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }

  // color-vision simulation: Machado et al. 2009 deuteranopia (severity 1) in linear RGB, and grayscale by luminance
  function lin(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function gam(v) { v = Math.max(0, Math.min(1, v)); return Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)); }
  function sim(hex, mode) {
    if (mode === "normal") return hex;
    var c = rgba(hex).slice(0, 3).map(lin), o;
    if (mode === "grey") { var y = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; o = [y, y, y]; }
    else { var M = [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.01182, 0.04294, 0.968881]];
      o = M.map(function (m) { return m[0] * c[0] + m[1] * c[1] + m[2] * c[2]; }); }
    return "rgb(" + o.map(gam).join(",") + ")";
  }
  function cvdBlock(c) {
    var views = [["normal", "Normal vision"], ["deutan", "Red-green (deuteranopia)"], ["grey", "Grayscale"]];
    function cell(set, mode) { return '<div class="ev-cvd-cell" style="background:' + c.bg + '">' + set.map(function (x) {
      return '<span><i style="background:' + sim(x[1], mode) + ";border-color:" + sim(x[2], mode) + '"></i>' + esc(x[0]) + "</span>"; }).join("") + "</div>"; }
    return '<div class="ev-cvd"><span class="ev-label">diet colors</span><span class="ev-label">before</span><span></span><span class="ev-label">after</span>' +
      views.map(function (v) { return '<div class="tk">' + v[1] + "</div>" + cell(c.before, v[0]) + '<span class="arrow">→</span>' + cell(c.after, v[0]); }).join("") + "</div>";
  }

  var R = {
    tokens: function (d) {
      function bars(title, col) {
        var max = Math.max.apply(null, d.drift.map(function (r) { return r[col]; }));
        return '<div><div class="ev-label">' + title + '</div><div class="ev-bars">' + d.drift.map(function (r, i) {
          return "<span>" + r[0] + '</span><span class="b' + (i === d.drift.length - 1 ? " last" : "") + '" style="width:' + Math.max(2, r[col] / max * 100) + '%"></span><span class="n">' + r[col] + "</span>";
        }).join("") + "</div></div>";
      }
      var n = d.groups.length, op = function (i) { return (1 - i * (0.75 / (n - 1))).toFixed(2); };
      return '<div class="ev-drift">' + (d.bars || [["Hard-coded colors in the CSS", 1], ["Hard-coded radii", 2]]).map(function (b) { return bars(b[0], b[1]); }).join("") + "</div>" +
        '<div class="ev-label">' + esc(d.drift[d.drift.length - 1][0]) + ": " + d.total + " tokens</div>" +
        '<div class="ev-stack" aria-hidden="true">' + d.groups.map(function (g, i) { return '<span style="flex:' + g[1] + ";--o:" + op(i) + '"></span>'; }).join("") + "</div>" +
        '<div class="ev-keys">' + d.groups.map(function (g, i) { return '<span><i style="--o:' + op(i) + '"></i>' + esc(g[0]) + " " + g[1] + "</span>"; }).join("") + "</div>";
    },
    contrast: function (d) {
      function sw(fg, bg, min) {
        var r = ratio(fg, bg), ok = r >= (min || 4.5);
        return '<div class="ev-sw" style="background:' + bg + ";color:" + fg + '"><span class="aa">Aa</span><span class="r ' + (ok ? "pass" : "fail") + '">' + r.toFixed(2) + "</span></div>";
      }
      var rows = d.rows.map(function (r) {
        var bg = r[4] ? r[4] : /on (#[0-9a-f]{6})/i.test(r[3]) ? r[3].match(/#[0-9a-f]{6}/i)[0] : d.bg;
        return '<div class="tk">' + esc(r[0]) + (r[3] ? "<small>" + esc(r[3]) + "</small>" : "") + "</div>" + sw(r[1], bg, r[5]) + '<span class="arrow">→</span>' + sw(r[2], bg, r[5]);
      }).join("");
      return '<div class="ev-cr"><span class="ev-label">' + esc(d.head || "token") + '</span><span class="ev-label">before</span><span></span><span class="ev-label">after</span>' + rows + "</div>" + (d.cvd ? cvdBlock(d.cvd) : "") +
        '<div class="ev-crit" aria-label="WCAG criteria named in commits">' + d.criteria.map(function (c) { return "<span>" + esc(c[0]) + (c[1] > 1 ? '<em class="x">×' + c[1] + "</em>" : "") + "</span>"; }).join("") + "</div>" +
        '<div class="ev-label" style="margin-top:6px">' + d.criteria.length + " WCAG criteria " + (d.mapped ? "addressed by " : "named across ") + d.commits + " commits" + (d.mapped ? " (mapped from their messages)" : "") + "</div>";
    }
  };

  return {
    has: function (e) { return !!(e && R[e.type]); },
    render: function (e, text) {
      return '<div class="ev">' + R[e.type](e) + '</div><p class="ev-cap">' + esc(e.caption || "") + "</p>" +
        (text ? '<details class="ev-more"><summary>The story</summary><p>' + esc(text) + "</p></details>" : "");
    },
    ratio: ratio
  };
})();
</script>

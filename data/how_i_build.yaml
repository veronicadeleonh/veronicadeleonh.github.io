# milestones: moments the way of working changed, drawn as marks on the commit chart (section 03).
# date: where the mark sits; label: short, on the chart; text: shown on hover or focus.
milestones:
- date: '2026-04-20'
  label: First work with Claude
  text: 'Back to the stalled coral project: a reworked model and a React map app, with a DESIGN.md borrowed from another repo as my first design guide.'
- date: '2026-05-27'
  label: Straight to code
  text: 'Volcano Explorer: the seismic-agent data rebuilt as a 3D globe, designed directly in code with Claude Code.'
- date: '2026-08-01'
  label: Cowork, CLAUDE.md as a log
  text: 'Over the summer, with Tracing Origins: Cowork replaced ChatGPT, the CLAUDE.md became a dated decision log, and friends started testing.'
- date: '2026-10-08'
  label: Three audits
  text: 'Consistency, tokens and accessibility, back to back in all three projects. Deep Lineages got its system in the first sprint.'
- date: '2026-10-26'
  label: Routines become skills
  text: 'The audits became reusable skills, every repo has a CLAUDE.md, and the coral came back as Reef Pulse with the whole system from the start.'

- id: reef
  name: Reef Pulse
  short: Reef
  emoji: 🪸
  status: In progress
  repo: https://github.com/veronicadeleonh/coral-bleaching-model
  github: coral-bleaching-model
  folder: corals
  chart_note: 'the 8 commits from the 2025 bootcamp sit before the chart starts, and the three.js rebuild isn''t committed yet, so the last weeks of work don''t show.'
  meta: Since 2025 · third version in progress · Python, React, three.js
  next:
  - polish
  - access
  - ship
  card:
    img: /images/project-reef-pulse.jpg
    mess: Over 11,000 reef surveys and a risk model
    access: One sentence and a coral that reacts
    lesson: The project I couldn't finish, back for a third try with the whole system from the start.
    tags:
    - three.js
    - Risk model
    - Domain knowledge
  story:
  - label: The question
    text: 'How heat, latitude and water variability change the risk of coral bleaching.'
  - label: The hard part
    text: 'I''m not a marine scientist. That stopped the project the first time.'
  - label: Workaround
    text: 'Claude takes the science side and explains each choice in plain language.'
  steps:
    question: 'How do heat, latitude and water variability change the risk of bleaching? My unfinished bootcamp project.'
    data: 'Reef Check surveys, one row per survey and grouped by ecoregion. "Noticeable bleaching" means more than 10% of the corals bleached. The model now trains on Reef Check only: a second dataset stays out on purpose.'
    design: 'Three looks for the same data: a notebook, a world map with a DESIGN.md borrowed from another repo, and now a 3D coral in three.js with the sentence, map and timeline on top of the scene. The palette comes from an underwater photo.'
    ux: 'No server to wake up: the risk is computed in the browser, so the coral answers at once.'
    polish: 'Render quality, a consistency pass, then a tokens page.'
    access: 'A 3D canvas needs a non-visual twin: the sentence and the map carry the same information. Plus reduced motion.'
    ship: 'Vercel, front end only.'
    context: 'The first CLAUDE.md written before shipping, not after.'
    skills: 'The first project with the skills planned before the first deploy.'
  evidence:
    data:
      type: data
      funnel: true
      chain: true
      sources: [NOAA CoRTAD v6 satellite temperatures, van Woesik & Kratochwill 2022 bleaching database, Kaggle copy]
      stages:
      - [23203, field surveys, 'Reef Check and Donner, each with the CoRTAD heat stress of its site and week']
      - [11179, Reef Check surveys, one source only]
      - [50, ecoregions, the map and the bars]
      - [3, model inputs, 'heat stress, water variability, latitude']
      caption: 'Satellite heat stress joined to field surveys, then half left out on purpose. CoRTAD ends in 2019.'
    design:
      type: looks
      caption: 'Three looks for the same risk: v2 borrowed a design, v3 took its palette from an underwater photo.'
      items:
      - label: v1 · Streamlit
        when: Apr 2026
        bg: '#ffffff'

# Content for /how-i-build/ (rendered by layouts/shortcodes/hib-*.html and the page script).
# To add a project: add a block under `projects` (same order as the home cards) (with a text for every step id) and an image in static/images/.
# The commit chart reads each project's `github` repo live; `folder` is the sibling folder used by
# scripts/build-how-i-build-data.py for the offline snapshot.
# card.mess / card.access: the messy data and what made it accessible (one short line each).
# Optional per project: `status` (a badge, e.g. In progress), `next` (step ids not done yet; their
# text is shown as "Next"), `tokens` (url + path of its tokens page; omit if it doesn't exist yet).
# `chart_note`: an optional line for the "About this data" box under the commit chart.
# chart_from: commits before this date are counted but not drawn, so an old repo doesn't squeeze the chart.
chart_from: '2026-04-01'
steps:
- id: question
  num: '01'
  label: Curiosity
  title: Start from curiosity
  text: 'An idea I can''t stop thinking about, turned into a question the data can answer.'
  me: The question I can't stop thinking about
  ai: Helps sharpen it into something data can answer
- id: data
  num: '02'
  label: Datasets
  title: Find data I can trust
  text: 'Every source exposes its data differently. Claude researches and cleans it; I decide what to trust.'
  me: Decide which sources to trust
  ai: Researches datasets, writes fetch and clean scripts
- id: design
  num: '03'
  label: Prototype
  title: Iterate together
  text: 'The versions happen in the running app: Claude brings code and ideas fast, I decide which one stays.'
  me: References, direction, which version stays
  ai: Code and visualization ideas, fast
- id: ux
  num: '04'
  label: UX audit
  title: Audit function and UX
  text: 'Can someone who has never seen this data explore it? My eye finds what breaks; Claude changes the code.'
  me: 'My eye: what breaks, what confuses'
  ai: Proposes fixes, changes the code
- id: polish
  num: '05'
  label: Polish
  title: Polish and pull out the system
  text: 'Repeated values become tokens, plus small tools to see the system.'
  me: Criterion and manual review
  ai: Refactors, tokens, tools like Token Lab
- id: access
  num: '06'
  label: Access
  title: Accessibility, which loops back
  text: 'Keyboard, screen reader, no color needed: WCAG 2.2 AA. I run the tools, Claude explains each fix first, and it loops back into UX.'
  me: Run Lighthouse, axe and WAVE; decide
  ai: Explains each fix, then applies it
- id: ship
  num: '07'
  label: Ship
  title: Ship it, share it, start again
  text: 'Deploy, share, listen. What friends say starts the next version.'
  me: Vercel setup, SEO images; commit, push, share
  ai: README, SEO tags and copy
- id: context
  num: CORE
  label: CLAUDE.md
  title: 'CLAUDE.md: memory for one repo'
  text: 'Each repo''s CLAUDE.md holds commands, rules and decisions, so every session starts with context instead of guesses.'
- id: skills
  num: CORE
  label: Skills
  title: 'Skills: know-how that travels'
  text: 'Reusable routines Claude loads when a task matches, written after explaining the same process in every project.'

        family: "'Source Sans 3', 'Source Sans Pro', sans-serif"
        swatches: ['#d4edda', '#fff3cd', '#fde8d8', '#f8d7da', '#2d2d2d']
        badge: [Bleaching, '#fde8d8', '#8a3a00', 4px]

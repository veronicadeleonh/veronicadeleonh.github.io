  story:
  - label: The question
    text: 'The world''s volcanoes on a 3D globe, with their eruptions and the plates underneath.'
  - label: The hard part
    text: 'Contrast math from tokens doesn''t tell you how text reads over a moving satellite map.'
  - label: My call
    text: 'The data lives on the globe, not in lists: if the map already shows it, a panel doesn''t repeat it.'
  steps:
    question: 'What does the world''s volcanic activity look like on one globe, and what moves underneath it?'
    data: 'Most of the data work happened a year earlier, in seismic-agent, a Streamlit dashboard from spring 2025: USGS earthquakes, eruption reports scraped from the Smithsonian Global Volcanism Program, and the PB2002 plate boundaries. Volcano Explorer reused that groundwork and curated 78 volcanoes on top.'
    design: 'The first of the three, and straight to code: the one fixed idea was a 3D globe. The look changed along the way. v2 brought a redesign inspired by live seismic dashboards, a monospace font and a rotating globe. v3 added synthesized sound.'
    ux: 'A false "erupted recently" badge, a seam on the Pacific Plate, and filters that now switch off when they don''t apply.'
    polish: 'A token pipeline: one tokens.json becomes the CSS and a JS module for Mapbox and the charts, plus a /styleguide page. It can also write a Figma-ready file, not used yet.'
    access: The second audit, with a full audit doc. Claude's first pass said "not yet verified in a browser", so I verified it. Volcano status and plate boundaries now read without color.
    ship: 'Live since May. v2 and v3 shipped once the site started getting traffic.'
    context: 'Written after v3: stack, token and accessibility rules, and every deferred decision.'
    skills: 'Where wcag-audit-learning and design-tokens-system took shape.'

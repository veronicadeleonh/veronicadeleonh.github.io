- id: tracing
  name: Tracing Origins
  short: Tracing
  emoji: 🏛️
  url: https://tracing-origins-lac.vercel.app/
  repo: https://github.com/veronicadeleonh/tracing-origins
  github: tracing-origins
  folder: colonial-museum-routes
  tokens:
    url: https://tracing-origins-lac.vercel.app/#tokens
    path: /#tokens
  meta: Since July 2026 · Python, React, Mapbox
  card:
    img: /images/project-tracing-origins.png
    mess: Four museums, four ways in, places no geocoder knows
    access: One map, plus a list view for keyboards
    lesson: Data rigor across four museums, then the first audit.
    tags:
    - Data sourcing
    - Data modeling
    - UX
    - Accessibility
  story:
  - label: The question
    text: 'Where did museum objects come from, and how did they get there?'
  - label: The hard part
    text: 'Many origins are historical regions no geocoder knows. A fallback chain and my own dictionary place them.'
  - label: My call
    text: 'Colonial context is a visual mark on each piece, not a filter. A filter would let people hide it.'
  steps:
    question: 'Where do museum objects come from, and how did they get there?'
    data: 'Four museums, four ways in: the Met''s public API, the Louvre through Wikidata, a polite 20-second-delay scraper for the British Museum, and Quai Branly''s undocumented search endpoint. Historical regions like "Mesopotamia" needed a hand-made gazetteer.'
    design: A quick static map in Python to check the data, then straight to React and the browser. The 3D globe came a month later. Claude's first visual proposal stayed almost unchanged. The iteration went into the map, the side panel and the colonial timeline.
    ux: '"Ur" matched inside "sur" and silently misplaced 12 Louvre objects. Fixed, with tests built from the real cases.'
    polish: Tokens for neutrals, surfaces and radii, a type scale and a spacing scale, plus a live tokens page with usage counts and the values still untokenized.
    access: 'The first audit, in October: contrast, 24px touch targets, focus order, and a list view as the keyboard alternative to the globe.'
    ship: 'Live with SEO and analytics. Friends'' feedback came back as a guided onboarding tour.'
    context: 'The first and the longest: a dated decision log with every bug and why it happened.'
    skills: 'Where the WCAG routine started: tools first, then one fix at a time.'
  evidence:
    data:
      type: data
      funnel: true
      sources: [Met API, Louvre via Wikidata, British Museum scraper, Quai Branly search]
      stages:
      - [703, objects collected, from four museums]
      - [645, in the app, each with a place of origin]
      - [215, origin places, on the map]
      - [93, countries, of origin]
      split:
        label: How precisely each origin could be placed
        parts: [[site, 208], [country, 276], [region, 60], [subregion, 43], [culture, 51], [editorial, 7]]
      caption: 'Four ways in, then the hard part: placing origins no modern geocoder knows.'
    design:
      type: iterations
      caption: 'One decision, three tries in one day. Hover a museum to follow its route.'
      bg: '#fbfaf7'
      museums: [[Met, '#c9a227'], [Louvre, '#3d7a8c'], [British Museum, '#b23a48']]
      items:
      - label: Try 1
        marker: ['#c9a227', '#c9a227', '#c9a227']
        note: Gold, the same as the Met
      - label: Try 2
        marker: ['#6a4c93', '#6a4c93', '#6a4c93']
        note: Violet, a fourth color that meant nothing
      - label: Kept
        marker: ['#c9a227', '#3d7a8c', '#b23a48']
        note: Each piece in its museum's color
    polish:
      type: tokens
      caption: 'Partial tokens: museum and map colors are still literals, listed on the tokens page.'
      drift:
      - [before, 58, 13]
      - [refactor, 49, 11]
      - [now, 39, 10]
      total: 27
      groups:
      - [Color, 12]
      - [Space, 7]
      - [Type, 6]
      - [Radius, 2]
    access:
      type: contrast
      caption: 'The first audit, computed live. Criteria mapped from commit messages.'
      bg: '#fbfaf7'
      head: color
      mapped: true
      rows:
      - [muted text ×18, '#928d82', '#6b665d', '']
      - [timeline caption, 'rgba(255,255,255,.45)', 'rgba(255,255,255,.7)', on the dark timeline band, '#302f2d']
